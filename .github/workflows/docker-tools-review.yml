name: Docker-tools Upgrade Compatibility Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'eng/docker-tools/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

permissions: {}

jobs:
  review:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.repository_id
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: microsoft/go-images/.github/workflows/docker-tools-review.lock.yml@microsoft/main
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
    secrets: inherit
